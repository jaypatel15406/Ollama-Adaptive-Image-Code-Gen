services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./logs:/app/logs
      - ./oLLaMa_generated_code_dir:/app/oLLaMa_generated_code_dir
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_PORT=11434
      - OLLAMA_MODEL=llama3.1
      - OLLAMA_HEALTH_CHECK_MAX_RETRIES=30
      - OLLAMA_HEALTH_CHECK_INTERVAL=5
      - OLLAMA_MODEL_READINESS_WAIT=20
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  ollama_data:
